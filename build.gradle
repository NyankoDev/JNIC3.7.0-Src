plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'dev.jnic'
version = '3.7.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.ow2.asm:asm-bom:9.11.1')
    implementation 'org.ow2.asm:asm'
    implementation 'org.ow2.asm:asm-tree'
    implementation 'org.ow2.asm:asm-analysis'
    implementation 'org.ow2.asm:asm-commons'
    implementation 'org.ow2.asm:asm-util'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.eclipsesource.minimal-json:minimal-json:0.9.5'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation('org.simpleframework:simple-xml:2.7.1') {
        exclude group: 'stax'
        exclude group: 'xpp3'
    }
    runtimeOnly 'xpp3:xpp3:1.1.4c'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

application {
    mainClass = 'dev.jnic.Jnic'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar') {
    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Implementation-Title': 'JNIC',
            'Implementation-Version': project.version
        )
    }
}

tasks.named('shadowJar') {
    archiveClassifier = 'all'
    mergeServiceFiles()
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/*.EC'
    exclude 'META-INF/INDEX.LIST', 'module-info.class', 'META-INF/versions/**/module-info.class'
    exclude 'javax/xml/namespace/**'
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
