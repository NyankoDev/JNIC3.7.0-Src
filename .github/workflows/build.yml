name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Shadow JAR (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic

      - name: Build Shadow JAR on Linux
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon --console=plain shadowJar

      - name: Build Shadow JAR on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon --console=plain shadowJar

      - name: Upload Shadow JAR
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jnic-${{ runner.os }}
          path: build/libs/*-all.jar
          if-no-files-found: error
